name: Build iOS

# Builds the app for the iOS simulator on a macOS runner with
# `eas build --local`. A simulator build needs no Apple Developer account or
# signing credentials. To build an installable .ipa instead, set up iOS
# credentials once with `eas credentials` and change PROFILE to `preview`.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROFILE: preview-simulator

jobs:
  build:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: >
          eas build --local --non-interactive
          --platform ios --profile ${{ env.PROFILE }}
          --output ${{ github.workspace }}/build/mailmark-ios-${{ github.sha }}${{ env.PROFILE == 'preview-simulator' && '.tar.gz' || '.ipa' }}

      - uses: actions/upload-artifact@v4
        with:
          name: mailmark-ios-${{ github.sha }}
          path: build/*
          if-no-files-found: error
